          <body>
            <div class="rates">
              <div class="ratelabel">
            <h3>Ratings</h3>
          </div>
            <div class="stars">
              <input type="radio" name="rating" id="star5" value="5" />
              <label for="star5">&#9733;</label>
              <input type="radio" name="rating" id="star4" value="4" />
              <label for="star4">&#9733;</label>
              <input type="radio" name="rating" id="star3" value="3" />
              <label for="star3">&#9733;</label>
              <input type="radio" name="rating" id="star2" value="2" />
              <label for="star2">&#9733;</label>
              <input type="radio" name="rating" id="star1" value="1" />
              <label for="star1">&#9733;</label>
            </div>
          </div>
            <p id="ratingValue"></p>
            <script>
              // Get all the stars elements
              const stars = document.querySelectorAll(
                '.stars input[type="radio"]'
              );
              // Get the rating value element
              const ratingValue = document.getElementById("ratingValue");

              // Add event listener to each star
              stars.forEach((star) => {
                star.addEventListener("change", (e) => {
                  // Update the rating value element with the selected value
                  ratingValue.textContent = `You rated ${e.target.value} out of 5 stars.`;
                });
              });
            </script>
          </body>
          <script>
            document
              .getElementById("image")
              .addEventListener("change", function (e) {
                var file = e.target.files[0];
                var reader = new FileReader();
                reader.onload = function (event) {
                  document
                    .getElementById("preview")
                    .setAttribute("src", event.target.result);
                };
                reader.readAsDataURL(file);
              });
          </script>
