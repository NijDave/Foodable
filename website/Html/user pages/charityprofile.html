    <title>Charity Profile</title>

  <body>
    <div class="navbar">
      <div class="left">
        <div id="mySidenav" class="sidenav">
          <a href="javascript:void(0)" class="closebtn" onclick="closeNav()"
            >&times;</a
          >
          <a href="#">Home</a>
          <a href="#">Restaurents</a>
          <a href="#">Groceries</a>
          <a href="#">profile</a>
          <a href="#">Logout</a>
        </div>

        <span onclick="openNav()" class="hamburger"
          ><button><img src="/images/hamburger.png" alt="" /></button
        ></span>
      </div>
      <div class="right">
        <!-- <span class="charityname">charityname</span>     -->
        <div class="profile">
          <a href="#"
            ><img
              src="/images/blank-profile-picture-973460__340.png"
              alt="user"
              width="10%"
              height="10%"
          /></a>
        </div>
      </div>
      <script>
        function openNav() {
          document.getElementById("mySidenav").style.width = "250px";
          document.getElementById("main").style.marginLeft = "250px";
        }
        function closeNav() {
          document.getElementById("mySidenav").style.width = "0";
          document.getElementById("main").style.marginLeft = "0";
        }
      </script>
      <script src="/javascript/charityprofile.js"></script>
    </div>
    <div class="profile-update">
      <table align="center" class="profiletable">
        <tr>
          <td align="right">
            <img
              src="/images/blank-profile-picture-973460__340.png"
              alt=""
              width="45%"
              height="45%"
              class="person logo"
            />
          </td>
          <td>
            <h1>
              <span id="Charityname"> Charity Name </span>
            </h1>
          </td>
        </tr>
        <tr>
          <td align="right" class="ImageInput">
            <input
              type="file"
              name="file"
              id="ImageFile"
              accept="image/png, image/jpg"
            /><label for="ImageFile" class="choosefile">Choose your file</label>
          </td>
          <td></td>
        </tr>
      </table>
      <div class="profileDetails">
        <div class="profilearea">
          <div class="infoarea">

              <li>
