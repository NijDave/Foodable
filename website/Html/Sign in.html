<html>

<head>
    <title>Sign in</title>
    <link rel="stylesheet" href="/Css/signin.css">
    <link rel="icon" href="/images/foodable logo title.png" sizes="16x16 32x32" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet">
</head>

<body>
    <div class="content">
        <div class="left">
            <div class="logo">
                <a href="/Html/Home.html">
                    <img src="/images/foodable logo 2.png" alt="logo" width="150px" height="150px" />
                </a>
            </div>
            <div class="heading">
                <h1>Hello User!</h1>
                <div class="pre">
                    <pre class="text">To keep connected with us please<br>login with your personal info</pre>
                </div>
                <div class="Login">
                    <a href="/Html/login.html"><button class="SigninLogin">Login</button></a>
                </div>
                <div class="footerright">
                    Contact us here
                    <br />
                    <a href="https://www.instagram.com">
                        <img src="/images/logo/instagram (2).png" alt="instalogo" width="25px" height="25px" />
                    </a>
                    <a href="https://twitter.com">
                        <img src="/images/logo/twitter (1).png" alt="twitter" width="25px" height="25px" />
                    </a>
                    <a href="https://www.linkedin.com">
                        <img src="/images/logo/linkedin.png" alt="linkedin" width="25px" height="25px" />
                    </a>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="loginsection">
                <div class="formarea">
                    <div class="formheading">
                        <h1>SIGNUP</h1>
                    </div>
                    <div class="form">
                        <div class="name">
                            <label for="name">Name:</label>
                            <input type="text" placeholder="Name" name="name" required><br>
                        </div>
                        <div class="email">
                            <label for="email">Email:</label>
                            <input type="email" placeholder="Email" name="email" required><br>
                        </div>
                        <div class="password">
                            <label for="password">Password:</label>
                            <input type="password" placeholder="password" name="password" required><br>
                        </div>
                        <div class="address">
                            <label for="Address">Address:</label>
                            <input type="text" placeholder="Address" name="addr" required><br>
                        </div>
                        <div class="registercheck">
                            Register as:
                            <input type="Radio" value="CHARITY" name="user" />CHARITY
                            <input type="Radio" value="CONTRIBUTOR" name="user" />CONTRIBUTOR
                        </div>
                        </br>
                        <div class="submitbutton">
                            <input type="submit" name="submit" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
