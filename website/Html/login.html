<html lang="en">
  <head>
    <title>Login</title>
    <link rel="stylesheet" href="/Css/Login.css" />
    <link
      rel="icon"
      href="images/foodable logo title.png"
      sizes="16x16 32x32"
      type="image/png"
    />
  </head>
  <body>
    <div class="content">
      <div class="left">
        <div class="logo">
          <a href="/Html/Home.html">
            <img
              src="/images/foodable logo 2.png"
              alt="logo"
              width="150px"
              height="150px"
            />
          </a>
        </div>
        <div class="heading">
          <h1>Welcome Back!</h1>
          <div class="pre">
            <pre
              class="text"
            >To keep connected with us please<br>login with your personal info</pre>
          </div>
          <div class="signin">
            <a href="/Html/Sign in.html"
              ><button class="SigninLogin">SIGN IN</button></a
            >
          </div>
          <div class="footerright">
            Contact us here
            <br />
            <a href="https://www.instagram.com">
              <img
                src="/images/logo/instagram (2).png"
                alt="instalogo"
                width="25px"
                height="25px"
              />
            </a>
            <a href="https://twitter.com">
              <img
                src="/images/logo/twitter (1).png"
                alt="twitter"
                width="25px"
                height="25px"
              />
            </a>
            <a href="https://www.linkedin.com">
              <img
                src="/images/logo/linkedin.png"
                alt="linkedin"
                width="25px"
                height="25px"
              />
            </a>
          </div>
        </div>
      </div>
      <div class="right">
        <div class="loginsection">
          <div method="post" class="form-area">
            <div class="formheading">
              <h2>ADMIN LOGIN</h2>
            </div>
            <!-- username -->
            <div class="username">
              <label for="username">USERNAME</label>
              <input
                type="text"
                placeholder="User Id"
                name="email"
                required
              />
            </div>
            <br />
            <!-- password -->
            <div class="password">
              <label for="Password">PASSWORD</label>
              <input
                type="password"
                placeholder="Enter password "
                name="password"
                required
              />
            </div>
            <br />
            <div class="Logintype">
              <p>LOGIN AS:</p>
              <br />
              <div class="rdbuttons">
                <div class="charityrb">
                  <input
                    type="Radio"
                    value="CHARITY"
                    name="user"
                    id="checkCharity"
                  />CHARITY
                </div>
                <div class="contributorrb">
                  <input
                    type="Radio"
                    value="CONTRIBUTOR"
                    name="user"
                  />CONTRIBUTOR
                </div>
              </div>
              <br />
            </div>
            <div class="loginbutton">
              <button type="submit" name="submit">LOGIN</button>
            </div>
            <br />
            <!-- <a href="SignUp.php">Sign up</a> -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
